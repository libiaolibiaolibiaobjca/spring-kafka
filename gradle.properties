projectGroup=cn.bjca.footstone.bpring.kafka
# 版本号增加内部补丁后缀，标识为 BJCA 手工维护的安全修复版本（基线 3.3.16）
version=3.3.16-nes.patch.1
# springKafkaVersion —— Spring for Apache Kafka 原始基线版本号（用于追溯）
