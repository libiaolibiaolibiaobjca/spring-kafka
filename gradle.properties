# =============================================================================
# BJCA 内部维护分支构建属性
# =============================================================================
# 项目全局 GroupId：替换官方 org.springframework.kafka，规避 SCA 工具按 GAV 特征误报
projectGroup=cn.bjca.footstone.bpring.kafka
# 内部补丁版本号：基于 upstream 2.9.13 发布线，后缀 nes.patch.1 标识手工维护版本
version=2.9.13-nes.patch.1-SNAPSHOT
# springKafkaVersion —— Spring Kafka 原始基线版本号
# 用途：构建时注入，标识所基于的上游版本
springKafkaVersion=2.9.13
# Gradle 性能优化配置
org.gradle.caching=true
org.gradle.parallel=true
kotlin.stdlib.default.dependency=false
