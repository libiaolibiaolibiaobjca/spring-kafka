apply plugin: 'maven-publish'

publishing {
	publications {
		mavenJava(MavenPublication) {
			pom {
				afterEvaluate {
					name = project.description
					description = project.description
				}
				url = linkScmUrl
				organization {
					name = 'Spring IO'
					url = 'https://spring.io/projects/spring-kafka'
				}
				licenses {
					license {
						name = 'Apache License, Version 2.0'
						url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
						distribution = 'repo'
					}
				}
				scm {
					url = linkScmUrl
					connection = linkScmConnection
					developerConnection = linkScmDevConnection
				}
				developers {
					developer {
						id = 'sobychacko'
						name = 'Soby Chacko'
						email = 'soby.chacko@broadcom.com'
						roles = ['project lead']
					}
					developer {
						id = 'garyrussell'
						name = 'Gary Russell'
						email = 'github@gprussell.net'
						roles = ['project founder and project lead emeritus']
					}
					developer {
						id = 'artembilan'
						name = 'Artem Bilan'
						email = 'artem.bilan@broadcom.com'
						roles = ['contributor']
					}
				}
				issueManagement {
					system = 'GitHub'
					url = linkIssue
				}
			}
			versionMapping {
				usage('java-api') {
					fromResolutionResult()
				}
				usage('java-runtime') {
					fromResolutionResult()
				}
			}
		}
	}
	// NES fork: 配置 Nexus 私服作为发布目标，凭证引用 ~/.gradle/gradle.properties 全局属性（不入库）。
	// 根据版本号自动选择目标仓库：SNAPSHOT → 快照仓库，Release → 正式仓库。
	repositories {
		maven {
			name = 'nexus'
			url = project.version.toString().endsWith('-SNAPSHOT') ? nexusSnapshotUrl : nexusReleaseUrl
			allowInsecureProtocol = true
			credentials {
				username = nexusUsername
				password = nexusPassword
			}
		}
	}
}